    demand_mean: 6.2e9
    demand_std:  1.5e8
    data_mean:   7.5e6
    data_std:    1.0e6
  - name: boundary_C
    demand_mean: 4.0e9
    demand_std:  1.0e9
    data_mean:   6.0e6
    data_std:    1.0e6
  - name: light_local
    demand_mean: 1.0e9
    demand_std:  2.0e8
    data_mean:   1.0e7
    data_std:    2.0e6
  - name: navigation
    demand_mean: 1.0e10
    demand_std:  2.0e9
    data_mean:   5.0e5
    data_std:    1.0e5

task_template_weights: [2, 3, 3, 3, 6, 6]