server_rates:
  - 2.0e9
  - 2.0e9
  - 2.0e9
  - 2.0e9
  - 3.5e9
  - 3.5e9
  - 3.5e9
  - 3.5e9
  - 3.5e9
  - 3.5e9
  - 3.5e9
  - 3.5e9
  - 2.5e9
  - 2.5e9
  - 2.5e9
  - 2.5e9

